<svg width="1200" height="650" viewBox="0 0 1200 650" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="650" fill="#0f172a"/>
  <text x="600" y="55" text-anchor="middle" fill="#e5e7eb" font-family="Arial" font-size="34" font-weight="700">CyberArk PAM Operations Workflow</text>
