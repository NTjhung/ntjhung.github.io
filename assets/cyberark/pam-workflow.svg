      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <g font-family="Arial" font-size="18" font-weight="700">
    <rect x="70" y="170" width="190" height="80" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="165" y="205" text-anchor="middle" fill="#e5e7eb">Privileged</text>
    <text x="165" y="230" text-anchor="middle" fill="#e5e7eb">Access Request</text>

    <rect x="330" y="170" width="190" height="80" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="425" y="205" text-anchor="middle" fill="#e5e7eb">Business</text>
    <text x="425" y="230" text-anchor="middle" fill="#e5e7eb">Justification</text>

    <rect x="590" y="170" width="190" height="80" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="685" y="205" text-anchor="middle" fill="#e5e7eb">Approval</text>
    <text x="685" y="230" text-anchor="middle" fill="#e5e7eb">Workflow</text>

    <rect x="850" y="170" width="190" height="80" rx="16" fill="#111827" stroke="#22c55e" stroke-width="2"/>
    <text x="945" y="205" text-anchor="middle" fill="#e5e7eb">Access</text>
    <text x="945" y="230" text-anchor="middle" fill="#e5e7eb">Granted</text>
  </g>

  <g stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)">
    <line x1="260" y1="210" x2="320" y2="210"/>
    <line x1="520" y1="210" x2="580" y2="210"/>
    <line x1="780" y1="210" x2="840" y2="210"/>
  </g>

  <g font-family="Arial" font-size="18" font-weight="700">
    <rect x="200" y="360" width="190" height="80" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="295" y="395" text-anchor="middle" fill="#e5e7eb">PSM Session</text>
    <text x="295" y="420" text-anchor="middle" fill="#e5e7eb">Monitoring</text>

