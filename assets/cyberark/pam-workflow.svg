    <text x="600" y="395" text-anchor="middle" fill="#e5e7eb">Password</text>
    <text x="600" y="420" text-anchor="middle" fill="#e5e7eb">Rotation</text>

    <rect x="810" y="360" width="190" height="80" rx="16" fill="#111827" stroke="#22c55e" stroke-width="2"/>
    <text x="905" y="395" text-anchor="middle" fill="#e5e7eb">Audit Evidence</text>
    <text x="905" y="420" text-anchor="middle" fill="#e5e7eb">Retained</text>
  </g>

  <g stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)">
    <line x1="945" y1="250" x2="945" y2="310"/>
    <line x1="945" y1="310" x2="305" y2="310"/>
    <line x1="305" y1="310" x2="305" y2="350"/>
    <line x1="390" y1="400" x2="495" y2="400"/>
    <line x1="695" y1="400" x2="800" y2="400"/>
